services:
  postgres:
    image: postgres:18-alpine
    container_name: app-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-5432}:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data: