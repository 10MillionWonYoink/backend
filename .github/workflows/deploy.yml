name: Deploy backend

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          set -euo pipefail

          BRANCH_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"
          SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker build \
            -t "${BRANCH_IMAGE}" \
            -t "${SHA_IMAGE}" \
            .

          docker push "${BRANCH_IMAGE}"
          docker push "${SHA_IMAGE}"

      - name: Update deployment files and deploy through SSM
        run: |
          set -euo pipefail

          SERVICE="backend"
          COMPOSE_SOURCE="docker-compose-server.yml"
          DEPLOY_SOURCE="deploy.sh"

          if [ ! -s "${COMPOSE_SOURCE}" ]; then
            echo "${COMPOSE_SOURCE} 파일을 찾을 수 없거나 비어 있습니다."
            exit 1
          fi

          if [ ! -s "${DEPLOY_SOURCE}" ]; then
            echo "${DEPLOY_SOURCE} 파일을 찾을 수 없거나 비어 있습니다."
            exit 1
          fi

          COMPOSE_B64="$(base64 -w 0 "${COMPOSE_SOURCE}")"
          DEPLOY_B64="$(base64 -w 0 "${DEPLOY_SOURCE}")"

          PARAMETERS="$(jq -nc \
            --arg compose "${COMPOSE_B64}" \
            --arg deploy "${DEPLOY_B64}" \
            --arg service "${SERVICE}" \
            '{
              commands: [
                "set -euo pipefail",
                "trap \"rm -f /tmp/docker-compose-server.yml /tmp/deploy.sh\" EXIT",

                ("printf '\''%s'\'' " + $compose + " | base64 -d > /tmp/docker-compose-server.yml"),
                ("printf '\''%s'\'' " + $deploy + " | base64 -d > /tmp/deploy.sh"),

                "bash -n /tmp/deploy.sh",

                "install -o ec2-user -g ec2-user -m 0644 /tmp/docker-compose-server.yml /opt/app/docker-compose-server.yml.new",
                "install -o ec2-user -g ec2-user -m 0755 /tmp/deploy.sh /opt/app/deploy.sh.new",

                "if [ -f /opt/app/.env ]; then sudo -u ec2-user docker compose --env-file /opt/app/.env -f /opt/app/docker-compose-server.yml.new config --quiet; fi",

                "if [ -f /opt/app/docker-compose-server.yml ]; then cp -a /opt/app/docker-compose-server.yml /opt/app/docker-compose-server.yml.bak; fi",
                "if [ -f /opt/app/deploy.sh ]; then cp -a /opt/app/deploy.sh /opt/app/deploy.sh.bak; fi",

                "mv /opt/app/docker-compose-server.yml.new /opt/app/docker-compose-server.yml",
                "mv /opt/app/deploy.sh.new /opt/app/deploy.sh",

                ("sudo -u ec2-user /opt/app/deploy.sh " + $service)
              ]
            }'
          )"

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_REF_NAME} ${GITHUB_SHA}" \
            --parameters "${PARAMETERS}" \
            --query "Command.CommandId" \
            --output text)"

          if ! aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"; then

            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'