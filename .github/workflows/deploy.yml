name: Deploy backend

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          BRANCH_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"
          SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker build \
            -t "${BRANCH_IMAGE}" \
            -t "${SHA_IMAGE}" \
            .

          docker push "${BRANCH_IMAGE}"
          docker push "${SHA_IMAGE}"

      - name: Deploy through SSM
        run: |
          SERVICE="backend-${GITHUB_REF_NAME}"

          PARAMETERS=$(printf \
            '{"commands":["sudo -u ec2-user /opt/app/deploy.sh %s"]}' \
            "${SERVICE}")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"; then

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"