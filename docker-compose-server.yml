services:
  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-test
      - backend-dev

  backend-test:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:test
    container_name: backend-test
    restart: unless-stopped

    environment:
      NODE_ENV: test
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL}

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

  backend-dev:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:dev
    container_name: backend-dev
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL}

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    container_name: app-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: