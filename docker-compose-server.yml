services:
  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /opt/app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/app/certbot/www:/var/www/certbot:ro
      - /opt/app/certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /opt/app/certbot/www:/var/www/certbot
      - /opt/app/certbot/conf:/etc/letsencrypt

  backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-dev}
    container_name: backend
    restart: unless-stopped

    env_file:
      - .env

    logging:
      driver: awslogs
      options:
        awslogs-region: "ap-northeast-2"
        awslogs-group: "/picyonik/prod/backend"
        awslogs-stream: "backend-ec2-1"

    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL:-false}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: app-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: