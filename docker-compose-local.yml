services:
  nginx:
    image: nginx:alpine
    container_name: app-nginx-local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-backend:local
    container_name: backend-local
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: "false"

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    container_name: app-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_local_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app-network

volumes:
  postgres_local_data:

networks:
  app-network: